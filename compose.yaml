services:
  backend:
    profiles: [backend]
    image: tms-backend:local
    build:
      context: ./backend
      dockerfile_inline: |
        FROM node:22-bookworm-slim AS base
        RUN apt-get update && apt-get install -y --no-install-recommends openssl ca-certificates \
          && rm -rf /var/lib/apt/lists/*
        WORKDIR /app

        FROM base AS build
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY prisma ./prisma
        RUN npm run prisma:generate
        COPY nest-cli.json tsconfig.json ./
        COPY src ./src
        RUN npm run build && npm prune --omit=dev && test -f dist/src/main.js

        FROM base AS runtime
        ENV NODE_ENV=production
        COPY --from=build /app/node_modules ./node_modules
        COPY --from=build /app/dist ./dist
        RUN install -d -o node -g node /app/uploads
        USER node
        CMD ["node", "dist/src/main.js"]
    env_file:
      - ./backend/.env
    environment:
      PORT: "4000"
      REDIS_URL: redis://redis:6379
      OPTIMIZER_URL: ${TMS_DOCKER_OPTIMIZER_URL:-http://host.docker.internal:8000}
      STORAGE_ROOT: /app/uploads
    ports:
      - "127.0.0.1:${TMS_BACKEND_PORT:-4000}:4000"
    volumes:
      - ${TMS_BACKEND_UPLOADS:-./backend/.data/uploads}:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  tms_redis_data:
