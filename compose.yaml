name: project-logictists

services:
  backend:
    image: tms-backend:local
    build:
      context: ./backend
      dockerfile_inline: |
        FROM node:22-bookworm-slim AS base
        RUN apt-get update && apt-get install -y --no-install-recommends openssl ca-certificates \
          && rm -rf /var/lib/apt/lists/*
        WORKDIR /app

        FROM base AS build
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY prisma ./prisma
        RUN npm run prisma:generate
        COPY nest-cli.json tsconfig.json tsconfig.build.json ./
        COPY src ./src
        RUN npm run build && npm prune --omit=dev && test -f dist/src/main.js

        FROM base AS runtime
        ENV NODE_ENV=production
        COPY --from=build /app/node_modules ./node_modules
        COPY --from=build /app/dist ./dist
        RUN install -d -o node -g node /app/uploads
        USER node
        CMD ["node", "dist/src/main.js"]
    env_file:
      - ./backend/.env
    environment:
      PORT: "4000"
      REDIS_URL: redis://redis:6379
      OPTIMIZER_URL: http://optimizer:8000
      STORAGE_ROOT: /app/uploads
    ports:
      - "127.0.0.1:${TMS_BACKEND_PORT:-4000}:4000"
    volumes:
      - ${TMS_BACKEND_UPLOADS:-./backend/.data/uploads}:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped

  frontend:
    image: tms-frontend:local
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:4000}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
      dockerfile_inline: |
        FROM node:22-bookworm-slim
        WORKDIR /app
        COPY package.json package-lock.json ./
        RUN npm ci
        COPY . .
        ARG VITE_API_URL
        ARG VITE_SOCKET_URL
        ARG VITE_MAPBOX_TOKEN
        RUN npm run build
        RUN install -d -o node -g node /app/node_modules/.vite-temp
        USER node
        CMD ["node", "node_modules/vite/bin/vite.js", "preview", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    ports:
      - "127.0.0.1:${TMS_FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    init: true
    restart: unless-stopped

  optimizer:
    image: tms-optimizer:local
    build:
      context: ./optimizer
      dockerfile_inline: |
        FROM python:3.12-slim-bookworm
        WORKDIR /app
        COPY requirements.txt docker-constraints.txt ./
        RUN pip install --no-cache-dir -r requirements.txt -c docker-constraints.txt
        COPY app ./app
        COPY benchmarks/cases ./benchmarks/cases
        RUN useradd --create-home appuser
        USER appuser
        CMD ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${TMS_OPTIMIZER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Only for rerunning the isolated role tests. Never started by start_tms.bat.
  roles-postgres:
    profiles: [roles-test]
    image: postgres:16
    environment:
      POSTGRES_USER: tms_test
      POSTGRES_PASSWORD: isolated_roles_test_only
      POSTGRES_DB: tms_roles_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - roles_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tms_test -d tms_roles_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  roles-redis:
    profiles: [roles-test]
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:56379:6379"
    volumes:
      - roles_redis_data:/data

volumes:
  tms_redis_data:
  roles_pg_data:
    external: true
    name: ${TMS_ROLES_PG_VOLUME:-tms_roles_pg_archive}
  roles_redis_data:
    external: true
    name: ${TMS_ROLES_REDIS_VOLUME:-tms_roles_redis_archive}
